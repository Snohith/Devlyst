services:
  db:
    image: postgres:16-alpine
    container_name: devlyst-db
    restart: always
    environment:
      POSTGRES_USER: devlyst
      POSTGRES_PASSWORD: devlyst_dev_password
      POSTGRES_DB: devlyst
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlyst -d devlyst"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Express API for projects/users (optional; the Next.js app runs without it).
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: devlyst-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://devlyst:devlyst_dev_password@db:5432/devlyst?schema=public
      CLIENT_ORIGINS: http://localhost:3000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  # Next.js app + Yjs WebSocket server (see the root Dockerfile).
  web:
    build:
      context: .
    container_name: devlyst-web
    restart: always
    ports:
      - "3000:3000"
      - "1234:1234"
    environment:
      NODE_ENV: production
      PORT: 1234
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_WS_HOST: localhost
      NEXT_PUBLIC_WS_PORT: 1234
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}

volumes:
  postgres_data:
