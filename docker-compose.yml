services:
  db:
    image: postgres:16-alpine
    container_name: devlyst-db
    restart: always
    environment:
      POSTGRES_USER: devlyst
      POSTGRES_PASSWORD: devlyst_dev_password
      POSTGRES_DB: devlyst
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlyst -d devlyst"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: devlyst-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://devlyst:devlyst_dev_password@db:5432/devlyst?schema=public
      CLIENT_URL: http://localhost:5173
      CLIENT_ORIGINS: http://localhost:5173,http://localhost:3000
      PISTON_URL: https://emkc.org/api/v2/piston/execute
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    depends_on:
      db:
        condition: service_healthy

  websocket:
    build:
      context: .
      dockerfile: websocket/Dockerfile
    container_name: devlyst-websocket
    restart: always
    ports:
      - "1234:1234"
    environment:
      NODE_ENV: production
      WS_PORT: 1234
      WS_HOST: 0.0.0.0
      API_URL: http://backend:4000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: devlyst-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
